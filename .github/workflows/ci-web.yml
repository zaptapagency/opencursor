name: ci-web

# Gate every change to the web/ SaaS app before it can reach main (and thus
# Railway). Full CI hardening (tests, prisma migrate diff, Dependabot) lands in
# Phase G; this is the baseline typecheck/lint/build/validate gate.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder used only so env validation and `next build` succeed; no DB
      # connection is opened during the build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm exec next build
